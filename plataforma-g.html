<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://ntoxrzbfrbscbusgmcpp.supabase.co https://tile.openstreetmap.org https://server.arcgisonline.com; connect-src https://ntoxrzbfrbscbusgmcpp.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plataforma G Riobamba</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
/* Plataforma G. Paleta "Chimborazo": andesita volcanica, nieve, verde de paramo y paja (ichu) dorada.
   Bricolage Grotesque para rotulos y cifras, Instrument Sans para la interfaz. */
:root{
  --ground:#E2E8EC; --block:#CBD5DC; --block-hi:#B5C2CB; --paper:#F7F9FA; --paper-2:#ECF0F3; --rule:#DDE3E7; --rule-2:#C4CDD4;
  --ink:#15202B; --ink-2:#445361; --ink-3:#6F7E8B;
  --andes:#1B2531; --andes-2:#283444; --andes-3:#36445A; --on-andes:#EEF2F6; --on-andes-2:#9DADBD;
  --brand:#2B6A55; --brand-2:#DDECE5; --on-brand:#FFFFFF;
  --ichu:#E2A62A; --ichu-2:#FBF0D4; --on-ichu:#1B2531;
  --red:#D3322A; --red-2:#FCE6E3; --rep:#2B6FCB; --inc:#6A4FC4; --ok:#2E8350; --wip:#C77700; --plan:#56657F; --eq:#5E6A72;
  --r-asf:#4A545D; --r-ado:#B5793C; --r-pie:#8D6E4E; --r-hor:#8FA0AE; --r-tie:#D9A23E; --r-las:#A89270; --r-nd:#A3ABA6;
  --t1:#1F2B33; --t2:#4F5D68; --t3:#86929A; --t4:#AEB7BC;
  --q0:var(--block); --q1:#cde2fb; --q2:#9ec5f4; --q3:#5598e7; --q4:#2a78d6; --q5:#184f95;
  --tipbg:#1B2531; --tipfg:#EEF2F6;
  --shadow:0 1px 2px rgba(21,32,43,.08),0 12px 32px -6px rgba(21,32,43,.22);
  --f-ui:'Instrument Sans','Segoe UI',Roboto,system-ui,sans-serif;
  --f-sign:'Bricolage Grotesque','Instrument Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:var(--f-ui);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F151B; --block:#1D2731; --block-hi:#2B3846; --paper:#141B22; --paper-2:#1B242D; --rule:#252F3A; --rule-2:#344150;
  --ink:#E4EAF0; --ink-2:#A8B6C3; --ink-3:#7A8996;
  --andes:#0B1117; --andes-2:#18212B; --andes-3:#26313E; --on-andes:#EEF2F6; --on-andes-2:#8A9BAC;
  --brand:#5CC3A0; --brand-2:#163329; --on-brand:#0B1117;
  --ichu:#F0B83E; --ichu-2:#3A2C10; --on-ichu:#0B1117;
  --red:#FF5C50; --red-2:#3B1714; --rep:#4C8EE8; --inc:#9C87EE; --ok:#4CC38A; --wip:#F0A93A; --plan:#93A2BE; --eq:#94A3AC;
  --r-asf:#A3AEB7; --r-ado:#D99B5B; --r-pie:#B0906E; --r-hor:#B9C6D0; --r-tie:#F0C060; --r-las:#C9B08A; --r-nd:#5F6A65;
  --t1:#E6EDF1; --t2:#AFBBC3; --t3:#74818A; --t4:#4A565D;
  --q1:#16365c; --q2:#1c5cab; --q3:#2a78d6; --q4:#5598e7; --q5:#9ec5f4;
  --tipbg:#EEF2F6; --tipfg:#0B1117;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -6px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0F151B; --block:#1D2731; --block-hi:#2B3846; --paper:#141B22; --paper-2:#1B242D; --rule:#252F3A; --rule-2:#344150;
  --ink:#E4EAF0; --ink-2:#A8B6C3; --ink-3:#7A8996;
  --andes:#0B1117; --andes-2:#18212B; --andes-3:#26313E; --on-andes:#EEF2F6; --on-andes-2:#8A9BAC;
  --brand:#5CC3A0; --brand-2:#163329; --on-brand:#0B1117;
  --ichu:#F0B83E; --ichu-2:#3A2C10; --on-ichu:#0B1117;
  --red:#FF5C50; --red-2:#3B1714; --rep:#4C8EE8; --inc:#9C87EE; --ok:#4CC38A; --wip:#F0A93A; --plan:#93A2BE; --eq:#94A3AC;
  --r-asf:#A3AEB7; --r-ado:#D99B5B; --r-pie:#B0906E; --r-hor:#B9C6D0; --r-tie:#F0C060; --r-las:#C9B08A; --r-nd:#5F6A65;
  --t1:#E6EDF1; --t2:#AFBBC3; --t3:#74818A; --t4:#4A565D;
  --q1:#16365c; --q2:#1c5cab; --q3:#2a78d6; --q4:#5598e7; --q5:#9ec5f4;
  --tipbg:#EEF2F6; --tipfg:#0B1117;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -6px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.42;overflow:hidden;
  -webkit-font-smoothing:antialiased;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ichu);outline-offset:2px}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums}

/* ---------- Estructura ---------- */
.app{height:100%;display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);grid-template-rows:auto minmax(0,1fr) 28px;
  grid-template-areas:"top top top" "left map right" "status status status";--lw:296px;--rw:380px}
.app:not(.show-left){--lw:0px}
.app:not(.show-right){--rw:0px}
.app:not(.show-left) .left,.app:not(.show-right) .right{display:none}

/* Cabecera: banda de andesita */
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));
  background:var(--andes);color:var(--on-andes);min-width:0;position:relative;z-index:12}
.brand{display:flex;align-items:center;gap:11px;min-width:0;flex:0 0 auto;margin-right:6px}
.mark{width:38px;height:38px;flex:0 0 38px;display:block;border-radius:10px;overflow:hidden}
.mark svg{display:block;width:100%;height:100%}
.brand b{display:block;font-family:var(--f-sign);font-weight:700;font-size:21px;letter-spacing:-.015em;line-height:1}
.brand small{display:block;color:var(--on-andes-2);font-size:12px;margin-top:3px;white-space:nowrap}
.tbtn{height:34px;display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.16);background:transparent;color:var(--on-andes);border-radius:9px;padding:0 12px;font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.tbtn:hover{background:var(--andes-2)}
.tbtn[aria-pressed="true"]{background:var(--andes-3);border-color:transparent;box-shadow:inset 0 -2px 0 var(--ichu)}
.tbtn[aria-pressed="true"] svg{color:var(--ichu)}
.tbtn svg{width:16px;height:16px;flex:0 0 16px}
#bAuth{border-color:rgba(255,255,255,.28)}
.search{position:relative;flex:1 1 320px;max-width:480px;min-width:0}
.search input{width:100%;height:36px;border:1px solid transparent;background:var(--andes-2);color:var(--on-andes);border-radius:10px;padding:0 12px 0 36px;font-size:14px;transition:background .15s,color .15s}
.search input::placeholder{color:var(--on-andes-2)}
.search input:focus{background:var(--paper);color:var(--ink);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ichu) 55%,transparent)}
.search input:focus::placeholder{color:var(--ink-3)}
.search svg{position:absolute;left:12px;top:11px;width:15px;height:15px;color:var(--on-andes-2);pointer-events:none}
.search:focus-within svg{color:var(--ink-3)}
.qres{position:absolute;left:0;right:0;top:42px;z-index:40;margin:0;padding:5px;list-style:none;background:var(--paper);color:var(--ink);border:1px solid var(--rule-2);border-radius:12px;box-shadow:var(--shadow);max-height:360px;overflow:auto}
.qres li{display:flex;align-items:baseline;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
.qres li[aria-selected="true"],.qres li:hover{background:var(--paper-2)}
.qres .k{font-size:12px;color:var(--ink-3);flex:0 0 86px}
.qres .empty{color:var(--ink-3);cursor:default}
.tright{display:flex;align-items:center;gap:8px;margin-left:auto;flex:0 0 auto}
.mode{font-size:12.5px;color:var(--on-andes-2);display:inline-flex;align-items:center;gap:7px;padding:0 6px;white-space:nowrap}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--on-andes-2)}
.mode.live i{background:#4CD48A;box-shadow:0 0 0 3px rgba(76,212,138,.22)}
.mode.tech i{background:var(--ichu);box-shadow:0 0 0 3px color-mix(in srgb,var(--ichu) 30%,transparent)}

/* ---------- Paneles ---------- */
.left,.right{background:var(--paper);min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent}
.left{grid-area:left;border-right:1px solid var(--rule)}
.right{grid-area:right;border-left:1px solid var(--rule);display:flex;flex-direction:column}
.sheethead{display:none}
.sec{padding:16px 16px 14px;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.lab{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px;font-family:var(--f-sign);font-size:15px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.lab.mt{font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:0}
.lab small{font-family:var(--f-ui);font-weight:500;font-size:12px;color:var(--ink-3);letter-spacing:0}
.lab button{border:0;background:none;color:var(--brand);font-family:var(--f-ui);font-weight:600;font-size:12.5px;padding:0}
.seg{display:flex;gap:2px;background:var(--paper-2);border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:6px 0;font-weight:600;font-size:13px;color:var(--ink-2);transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.sel{width:100%;height:36px;border:1px solid var(--rule-2);background:var(--paper);border-radius:10px;padding:0 10px;font-size:14px}
.mt{margin-top:8px}

.li{position:relative}
.row{display:grid;grid-template-columns:18px 16px 18px minmax(0,1fr) auto;align-items:center;gap:7px;min-height:32px;padding:0 6px 0 0;border-radius:8px;cursor:pointer;font-size:14px}
.row:hover{background:var(--paper-2)}
.row input{margin:0;width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ct{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:20px;text-align:right}
.row.dis{opacity:.45}
.car{grid-column:1;width:18px;height:22px;border:0;background:none;padding:0;color:var(--ink-3);display:grid;place-items:center}
.car svg{width:10px;height:10px;transition:transform .18s}
.car[aria-expanded="true"] svg{transform:rotate(90deg)}
.subs{padding:0 0 4px 18px}
.subs .row{font-size:13.5px;min-height:28px}
.opt{display:flex;align-items:center;gap:8px;padding:2px 0 6px 40px;font-size:13px;color:var(--ink-2)}
.opt select{height:30px;border:1px solid var(--rule-2);background:var(--paper);border-radius:8px;padding:0 6px;font-size:13px;flex:1;min-width:0}
.sw{width:18px;height:18px;display:block;overflow:visible}
.ramp{display:flex;gap:2px;padding:2px 0 8px 40px}
.ramp span{flex:1;font-size:10.5px;color:var(--ink-3);text-align:center;font-variant-numeric:tabular-nums}
.ramp span::before{content:"";display:block;height:8px;border-radius:2px;background:var(--c);margin-bottom:3px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--rule-2);background:var(--paper);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.chip.est[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.note{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
.rods{display:flex;flex-wrap:wrap;gap:5px;padding:2px 0 6px 40px}
.rchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule-2);background:var(--paper);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:600;color:var(--ink-2);transition:background .15s,border-color .15s,color .15s}
.rchip i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.rchip .num{font-weight:500;color:var(--ink-3);font-size:11.5px}
.rchip:hover{border-color:var(--ink-3)}
.rchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rchip[aria-pressed="true"] .num{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.rnote{padding-left:40px;margin-top:0}
.rstreets{margin:2px 0 8px 40px;border-left:2px solid var(--rule-2);padding-left:8px;max-height:260px;overflow:auto}
.rsum{margin:0 0 4px;font-size:12.5px;color:var(--ink-2)}
.rst{display:flex;justify-content:space-between;gap:8px;width:100%;border:0;background:none;padding:5px 6px;border-radius:7px;text-align:left;font-size:13px}
.rst:hover{background:var(--paper-2)}
.rst .num{color:var(--ink-3);font-size:12px;white-space:nowrap}
.rst.sn span:first-child{color:var(--ink-2);font-style:italic}
.rst small{font-style:normal;color:var(--ink-3)}

/* ---------- Mapa ---------- */
.mapwrap{grid-area:map;position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--ground)}
#map{--k:1;position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#map.drag{cursor:grabbing}
#map:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--ichu)}
.blk{fill:var(--block);stroke:var(--ground);stroke-width:.6;vector-effect:non-scaling-stroke}
.blk.q0{fill:var(--q0)} .blk.q1{fill:var(--q1)} .blk.q2{fill:var(--q2)} .blk.q3{fill:var(--q3)} .blk.q4{fill:var(--q4)} .blk.q5{fill:var(--q5)}
.blk.hov{stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
#map.has-base .blk{fill-opacity:.1}
.tile{pointer-events:none}
.bar{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:5 3;vector-effect:non-scaling-stroke;pointer-events:none}
.bar.on{stroke:var(--ichu);stroke-width:3;stroke-dasharray:none}
.bmask{fill:var(--ground);fill-opacity:.6;pointer-events:none;fill-rule:evenodd}
.plat{fill:none;stroke:var(--ink);stroke-width:2.2;vector-effect:non-scaling-stroke;pointer-events:none}
.plat2{fill:none;stroke:var(--ichu);stroke-width:9;stroke-opacity:.3;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.st{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.st.out{opacity:.32}
.st.tie{stroke-dasharray:3 2}
.sthi{fill:none;stroke:var(--ichu);stroke-width:7;stroke-opacity:.75;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
.lbl,.slbl,.mk{transform:translate(calc(var(--tx)*1px),calc(var(--ty)*1px)) rotate(var(--rot,0deg)) scale(var(--k))}
.lbl,.slbl{pointer-events:none}
.lbl text{font-family:var(--f-sign);font-weight:800;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;text-anchor:middle;fill:var(--ink);paint-order:stroke;stroke:var(--ground);stroke-width:4px;stroke-linejoin:round}
.lbl .sub{font-family:var(--f-ui);font-weight:500;font-size:10px;letter-spacing:0;text-transform:none;fill:var(--ink-2);font-variant-numeric:tabular-nums}
.slbl text{font-family:var(--f-ui);font-weight:500;font-size:10.5px;text-anchor:middle;fill:var(--ink-2);paint-order:stroke;stroke:var(--ground);stroke-width:3px;stroke-linejoin:round}
.slbl{display:none}
#map.z2 .slbl{display:block}
#map.z1 .lbl .sub{display:none}
.mk{cursor:pointer}
.mk use{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.mk:hover use{transform:scale(1.18)}
.mk .halo{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:3 2.5;opacity:0}
.mk.sel .halo{opacity:1}
.mk.inc{cursor:pointer}
/* Puntos rojos por verificar: laten para pedir atencion */
.mk .pulse{fill:none;stroke:var(--red);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s cubic-bezier(.2,.6,.3,1) infinite;pointer-events:none}
@keyframes pulse{0%{transform:scale(.8);opacity:.75}80%,100%{transform:scale(2.3);opacity:0}}
.heat{pointer-events:none;opacity:.88}
.edge{fill:none;stroke:var(--ink-3);stroke-width:1;opacity:.5;vector-effect:non-scaling-stroke}
/* Entrada: el territorio se ilumina y los registros caen en su lugar (solo al abrir) */
#map.intro [data-layer=manz]{animation:fadein .8s ease-out both}
#map.intro .plat2{animation:glow 2.2s ease-out both}
#map.intro .mk use{animation:drop .5s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(.45s + var(--i,0) * 40ms)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes glow{0%{stroke-opacity:0;stroke-width:2}35%{stroke-opacity:.8;stroke-width:22}100%{stroke-opacity:.3;stroke-width:9}}
@keyframes drop{from{transform:translateY(-14px) scale(.3);opacity:0}to{transform:none;opacity:1}}

.mctl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;background:var(--andes);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:5}
.mctl button{width:38px;height:38px;border:0;background:none;display:grid;place-items:center;color:var(--on-andes);transition:background .15s}
.mctl button+button{border-top:1px solid rgba(255,255,255,.1)}
.mctl button:hover{background:var(--andes-3)}
.mctl svg{width:16px;height:16px}
.scale{position:absolute;left:12px;bottom:12px;display:flex;align-items:flex-end;gap:10px;background:color-mix(in srgb,var(--paper) 92%,transparent);border-radius:10px;padding:6px 10px;z-index:4;pointer-events:none;box-shadow:0 1px 3px rgba(21,32,43,.12)}
.north{width:16px;height:26px;color:var(--ink)}
.sbar{display:flex;flex-direction:column;gap:2px}
.sbar i{display:block;height:6px;border:1.5px solid var(--ink);border-top:0}
.sbar span{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:var(--andes);color:var(--on-andes);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:500;z-index:4;pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);animation:hintout .6s ease-in 9s forwards}
@keyframes hintout{to{opacity:0}}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ichu);color:var(--on-ichu);border-radius:10px;padding:6px 6px 6px 14px;font-weight:600;font-size:13px;z-index:6;box-shadow:var(--shadow);max-width:calc(100% - 120px)}
.banner button{border:0;background:rgba(255,255,255,.4);border-radius:7px;padding:3px 10px;font-weight:700;font-size:12px;color:var(--on-ichu)}
.picking{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--andes);color:var(--on-andes);border-radius:999px;padding:8px 16px;font-weight:600;z-index:6;box-shadow:var(--shadow)}

.pop{position:absolute;z-index:8;width:min(310px,calc(100% - 24px));background:var(--paper);border-radius:14px;box-shadow:var(--shadow);transform:translate(-50%,calc(-100% - 18px));font-size:13.5px;animation:popin .18s ease-out}
@keyframes popin{from{opacity:0;margin-top:6px}to{opacity:1;margin-top:0}}
.pop::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--paper);transform:translateX(-50%) rotate(45deg);border-radius:0 0 3px 0}
.pop.below{transform:translate(-50%,18px)}
.pop.below::after{bottom:auto;top:-6px;transform:translateX(-50%) rotate(225deg)}
.pop .ph{display:flex;align-items:center;gap:8px;padding:12px 38px 0 14px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.pop .ph svg{width:18px;height:18px}
.pop h3{margin:4px 14px 0;font-family:var(--f-sign);font-size:18px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 14px 0;font-size:13px}
.pop dt{color:var(--ink-3)}
.pop dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pop p{margin:10px 14px 0;color:var(--ink-2)}
.pop .pa{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 0;padding:10px 14px;border-top:1px solid var(--rule);background:var(--paper-2);border-radius:0 0 14px 14px}
.pop .pa select{height:32px;border:1px solid var(--rule-2);background:var(--paper);border-radius:8px;padding:0 8px;font-size:13px;flex:1;min-width:0}
.pop .pbody{padding-bottom:14px}
.pfoto{display:block;width:calc(100% - 28px);max-height:170px;object-fit:cover;border-radius:10px;margin:10px 14px 0}
.pop .pbody:has(+.pa){padding-bottom:0}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;background:none;color:var(--ink-3);font-size:19px;line-height:1;border-radius:8px}
.x:hover{background:var(--paper-2);color:var(--ink)}
.mini{height:32px;border:1px solid var(--rule-2);background:var(--paper);border-radius:8px;padding:0 11px;font-size:13px;font-weight:600}
.mini.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--rule-2))}
.mini.armed{background:var(--red);color:#fff;border-color:var(--red)}
.dchips{display:flex;flex-wrap:wrap;gap:3px}
.dchips span{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--paper-2);color:var(--ink-3)}
.dchips span.on{background:var(--red);color:#fff}

.ctx{position:absolute;z-index:9;min-width:250px;max-width:310px;background:var(--paper);border-radius:14px;padding:5px;box-shadow:var(--shadow);animation:popin .14s ease-out}
.ctx .ch{padding:8px 10px 9px;font-size:12.5px;color:var(--ink-2);border-bottom:1px solid var(--rule);margin-bottom:4px}
.ctx .ch b{display:block;color:var(--ink);font-family:var(--f-sign);font-size:15px;font-weight:700}
.ctx .ch .num{font-size:11.5px;color:var(--ink-3)}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;border-radius:9px;padding:9px 10px;font-weight:600;font-size:14px}
.ctx button:hover,.ctx button:focus-visible{background:var(--paper-2)}
.ctx button:disabled{opacity:.4;cursor:not-allowed}
.ctx button svg{width:20px;height:20px;flex:0 0 20px}
.ctx hr{border:0;border-top:1px solid var(--rule);margin:4px 0}
.ctx .kb{margin-left:auto;font-size:11px;color:var(--ink-3);font-weight:500}

/* ---------- Analisis ---------- */
.tabs{display:flex;gap:4px;padding:8px 10px 0;position:sticky;top:0;background:var(--andes);z-index:2}
.tab{flex:1;border:0;background:none;padding:9px 4px 10px;font-weight:600;font-size:14px;color:var(--on-andes-2);border-radius:10px 10px 0 0;transition:color .15s,background .15s}
.tab:hover{color:var(--on-andes)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--paper)}
.tab .num{font-weight:700}
.scope{padding:16px 16px 14px;border-bottom:1px solid var(--rule)}
.scope h2{margin:0;font-family:var(--f-sign);font-weight:800;font-size:27px;line-height:1.05;letter-spacing:-.02em}
.scope p{margin:5px 0 0;color:var(--ink-3);font-size:13px}
.scope p button{border:0;background:none;padding:0;color:var(--brand);font-weight:600;font-size:13px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 12px 14px;border-bottom:1px solid var(--rule)}
.kpi{background:var(--paper-2);padding:11px 13px 12px;min-width:0;border-radius:12px}
.kpi .kl{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.kpi .kv{font-family:var(--f-sign);font-weight:700;font-size:31px;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:3px}
.kpi .ks{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.kpi.alert{background:var(--red-2);box-shadow:inset 3px 0 0 var(--red)}
.kpi.alert .kv{color:var(--red)}
.hb{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr) 42px;align-items:center;gap:8px;width:100%;border:0;background:none;padding:4px 2px;text-align:left;font-size:13px;border-radius:6px}
button.hb:hover{background:var(--paper-2)}
.hb .hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hb .ht{height:10px;background:var(--paper-2);border-radius:999px;overflow:hidden}
.hb .ht i{display:block;height:100%;border-radius:999px;min-width:4px;transform-origin:left}
#stats.intro .hb .ht i{animation:grow .7s cubic-bezier(.2,.7,.3,1) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.hb .hv{font-size:12px;text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:600}
.hb.off .hl,.hb.off .hv{color:var(--ink-3)}
.hb.off .ht i{opacity:.3}
.cols{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:5px;align-items:end}
.col{display:flex;flex-direction:column;align-items:stretch;gap:4px;border:0;background:none;padding:0;min-width:0}
button.col:hover .stk{background:var(--paper-2)}
.col .cv{font-size:11px;font-weight:600;color:var(--ink-2);text-align:center;min-height:14px;font-variant-numeric:tabular-nums}
.col .stk{height:88px;display:flex;flex-direction:column-reverse;gap:2px;border-bottom:1.5px solid var(--rule-2);border-radius:6px 6px 0 0;padding:0 16%}
.col .stk i{display:block;width:100%;flex:0 0 auto;transform-origin:bottom}
#stats.intro .col .stk i{animation:rise .6s cubic-bezier(.2,.7,.3,1) both}
@keyframes rise{from{transform:scaleY(0)}to{transform:none}}
.col .stk i:last-child{border-radius:5px 5px 0 0}
.col .cl{font-size:11px;color:var(--ink-3);text-align:center;white-space:nowrap;overflow:hidden}
.col.on .cl{color:var(--ink);font-weight:700}
.col.dim .stk i{opacity:.3}
.stack{display:flex;gap:2px;height:14px;margin:2px 0 8px}
.stack i{display:block;height:100%;min-width:3px}
.stack i:first-child{border-radius:999px 0 0 999px}
.stack i:last-child{border-radius:0 999px 999px 0}
.stack i:only-child{border-radius:999px}
.legend{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend .num{color:var(--ink);font-weight:600}
.empty{color:var(--ink-3);font-size:13px;margin:0}
.callout{font-size:13px;color:var(--ink-2);margin:10px 0 0}
.callout b{color:var(--ink)}

.recs{padding:8px 0}
.rk{display:flex;gap:6px;padding:6px 14px 10px;align-items:center}
.rk .seg{flex:1}
.rlist{list-style:none;margin:0;padding:0 8px}
.ri{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;transition:background .12s}
.ri+.ri{margin-top:2px}
.ri:hover{background:var(--paper-2)}
.ri.sel{background:var(--ichu-2);box-shadow:inset 3px 0 0 var(--ichu)}
.ri svg{width:20px;height:20px;margin-top:1px}
.ri b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri span{display:block;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri .rm{font-size:11.5px;font-variant-numeric:tabular-nums}

/* ---------- Barra de estado ---------- */
.status{grid-area:status;display:flex;align-items:center;gap:18px;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));border-top:1px solid var(--rule);background:var(--paper);font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.status span{overflow:hidden;text-overflow:ellipsis}
.status .grow{flex:1}

/* ---------- Ventanas ---------- */
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--tipbg);color:var(--tipfg);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:270px;box-shadow:0 6px 18px rgba(0,0,0,.24)}
.tip b{font-weight:700}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,21,27,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:14px;animation:fadein .15s ease-out}
.sheet{background:var(--paper);width:min(520px,100%);max-height:100%;overflow:auto;border-radius:18px;padding:20px 22px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:sheetin .22s cubic-bezier(.2,.8,.3,1)}
@keyframes sheetin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.sheet h2{margin:0;font-family:var(--f-sign);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.fine{font-size:13px;color:var(--ink-3);margin:4px 0 0}
form{display:flex;flex-direction:column;gap:14px;margin-top:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
label.f select,label.f input,label.f textarea{border:1px solid var(--rule-2);background:var(--paper-2);border-radius:10px;padding:10px 11px;font-weight:400;width:100%;transition:border-color .15s,background .15s}
label.f select:focus,label.f input:focus,label.f textarea:focus{outline:none;border-color:var(--brand);background:var(--paper);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
textarea{min-height:84px;resize:vertical}
.where{border-radius:10px;background:var(--andes);color:var(--on-andes);padding:9px 12px;font-size:13.5px;font-weight:600}
.where .num{font-size:11.5px;color:var(--on-andes-2);display:block;font-weight:400}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{position:relative}
.days input{position:absolute;opacity:0;pointer-events:none}
.days span{display:block;border:1px solid var(--rule-2);border-radius:999px;padding:7px 0;width:50px;text-align:center;cursor:pointer;font-size:13.5px;font-weight:600;transition:background .12s,color .12s,border-color .12s}
.days input:checked+span{background:var(--red);border-color:var(--red);color:#fff}
.days input:focus-visible+span{outline:2px solid var(--ichu);outline-offset:2px}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13px;line-height:1.45}
.chk input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex:0 0 16px}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:1em}
.acts{display:flex;gap:10px}
.btn{flex:1;height:44px;border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);border-radius:12px;font-weight:700;font-size:15px;transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--rule-2)}
.btn.alt:hover{background:var(--paper-2);filter:none}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--andes);color:var(--on-andes);padding:11px 18px 11px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:70;max-width:calc(100% - 32px);box-shadow:var(--shadow);border-left:4px solid var(--ichu);animation:toastin .25s cubic-bezier(.2,.8,.3,1)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- Pantallas medianas y telefono ---------- */
@media (max-width:1180px){
  .app{--rw:0px}
  .app.show-right .right{display:flex;position:absolute;right:0;top:var(--toph,56px);bottom:28px;width:min(380px,100%);z-index:20;box-shadow:var(--shadow)}
  .brand small{display:none}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top" "map"}
  .status{display:none}
  .top{flex-wrap:wrap;row-gap:10px;padding-top:max(10px,env(safe-area-inset-top,0px))}
  .search{order:9;flex:1 1 100%;max-width:none}
  .brand b{font-size:19px}
  .mark{width:34px;height:34px;flex-basis:34px}
  .tbtn{padding:0 10px}
  .tbtn .tl{display:none}
  .mode span{display:none}
  .app.show-left .left,.app.show-right .right{display:flex;flex-direction:column;position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:66%;z-index:30;border:0;border-radius:20px 20px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheetup .26s cubic-bezier(.2,.8,.3,1)}
  @keyframes sheetup{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
  .sheethead{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 8px 16px;position:sticky;top:0;background:var(--paper);z-index:3;border-radius:20px 20px 0 0}
  .sheethead::before{content:"";position:absolute;left:50%;top:6px;width:38px;height:4px;border-radius:2px;background:var(--rule-2);transform:translateX(-50%)}
  .sheethead b{font-family:var(--f-sign);font-size:20px;font-weight:800;letter-spacing:-.01em}
  .sheethead button{width:36px;height:36px;border:0;background:var(--paper-2);border-radius:50%;font-size:20px;color:var(--ink-2)}
  .right .sheethead{background:var(--andes);color:var(--on-andes)}
  .right .sheethead button{background:var(--andes-2);color:var(--on-andes)}
  .tabs{padding-top:0}
  .left,.right{overflow:hidden}
  .left>.inner,.right>.inner{overflow:auto;min-height:0;flex:1 1 auto}
  .hint{bottom:auto;top:12px;left:12px;transform:none;font-size:12.5px;white-space:normal;width:max-content;max-width:calc(100% - 76px)}
  .lbl text{font-size:10.5px;stroke-width:3.5px}
  .banner{max-width:calc(100% - 70px);font-size:12px}
  .mctl button{width:42px;height:42px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <header class="top" id="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 38 38"><rect width="38" height="38" fill="#E2A62A"/><path d="M1 33 13.5 17l5 6 6.2-10L37 33Z" fill="#1B2531"/><path d="m24.7 13 4.4 7-2.4-1.1-2 2.1-2-2.2-2.3 1.2Z" fill="#F7F9FA"/></svg></span><div><b>Plataforma G</b><small>Municipio de Riobamba</small></div></div>
    <button class="tbtn" id="tLeft" aria-pressed="true" aria-controls="left" title="Capas y filtros"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2 1.5 5.5 8 9l6.5-3.5L8 2Z"/><path d="m1.5 8.5 6.5 3.5 6.5-3.5"/><path d="m1.5 11 6.5 3.5 6.5-3.5" opacity=".5"/></svg><span class="tl">Capas</span></button>
    <div class="search" role="search">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar barrio, calle, equipamiento u obra" autocomplete="off" aria-label="Buscar en la plataforma" aria-controls="qres" aria-expanded="false" role="combobox" aria-autocomplete="list">
      <ul class="qres" id="qres" role="listbox" hidden></ul>
    </div>
    <div class="tright">
      <span class="mode" id="mode"><i></i><span id="modeTxt"></span></span>
      <button class="tbtn" id="bAuth" hidden><span class="tl" id="bAuthTxt">Acceso técnico</span></button>
      <button class="tbtn" id="tRight" aria-pressed="true" aria-controls="right" title="Análisis y registros"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 14V8M6 14V3M10 14V6M14 14V10"/></svg><span class="tl">Análisis</span></button>
    </div>
  </header>

  <aside class="left" id="left" aria-label="Capas y filtros">
    <div class="sheethead"><b>Capas y filtros</b><button type="button" data-close="left" aria-label="Cerrar">&times;</button></div>
    <div class="inner" id="tree"></div>
  </aside>

  <section class="mapwrap" id="mapwrap">
    <svg id="map" tabindex="0" role="application" aria-label="Mapa de la Plataforma G. Clic derecho o mantener presionado para reportar."></svg>
    <div class="picking" id="picking" hidden></div>
    <div class="mctl">
      <button type="button" id="zi" aria-label="Acercar" title="Acercar (+)"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg></button>
      <button type="button" id="zo" aria-label="Alejar" title="Alejar (−)"><svg viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10"/></svg></button>
      <button type="button" id="zr" aria-label="Encuadrar la plataforma" title="Encuadrar la plataforma (0)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3"/><rect x="5.5" y="5.5" width="5" height="5"/></svg></button>
    </div>
    <div class="scale" aria-hidden="true">
      <svg class="north" viewBox="0 0 16 26"><path d="M8 1 13 15 8 12 3 15Z" fill="currentColor"/><text x="8" y="25" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor" font-family="Barlow Condensed,sans-serif">N</text></svg>
      <div class="sbar"><i id="sbar"></i><span id="stxt"></span></div>
    </div>
    <div class="hint" id="hint">Clic derecho en el mapa para reportar un problema</div>
    <div class="pop" id="pop" role="dialog" aria-label="Detalle del elemento" hidden></div>
    <div class="ctx" id="ctx" role="menu" hidden></div>
  </section>

  <aside class="right" id="right" aria-label="Análisis y registros">
    <div class="sheethead"><b>Análisis</b><button type="button" data-close="right" aria-label="Cerrar">&times;</button></div>
    <div class="inner" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabS" aria-selected="true">Análisis</button>
        <button class="tab" role="tab" id="tabR" aria-selected="false">Registros <span class="num" id="recN"></span></button>
      </div>
      <div id="stats"></div>
      <div id="recs" class="recs" hidden></div>
    </div>
  </aside>

  <footer class="status" id="status">
    <span id="sCoord">UTM 17S —</span><span id="sWhere"></span><span class="grow"></span><span id="sScale"></span><span id="sSync"></span>
  </footer>
</div>
<div class="tip" id="tip" hidden></div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>

const polys=(g,t)=>t==='Polygon'?[g]:g;
const bb=[1e9,1e9,-1e9,-1e9];
polys(D.platform,D.ptype).forEach(p=>p[0].forEach(q=>{bb[0]=Math.min(bb[0],q[0]);bb[1]=Math.min(bb[1],q[1]);bb[2]=Math.max(bb[2],q[0]);bb[3]=Math.max(bb[3],q[1])}));
const LON0=(bb[0]+bb[2])/2,LAT0=(bb[1]+bb[3])/2;
const KX=111320*Math.cos(LAT0*Math.PI/180),KY=110574;      // metros por grado en Riobamba
const P=(lo,la)=>[(lo-LON0)*KX,-(la-LAT0)*KY];
const U=(x,y)=>[x/KX+LON0,-y/KY+LAT0];
const f1=v=>Math.round(v*10)/10;
const ringD=r=>'M'+r.map(q=>{const a=P(q[0],q[1]);return f1(a[0])+' '+f1(a[1])}).join('L')+'Z';
const pathD=(g,t)=>polys(g,t).map(p=>p.map(ringD).join('')).join('');
function pip(x,y,r){let ins=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/((b[1]-a[1])||1e-18)+a[0])ins=!ins}return ins}
const inPoly=(lo,la,g,t)=>polys(g,t).some(p=>pip(lo,la,p[0])&&!p.slice(1).some(h=>pip(lo,la,h)));
const inPlat=(lo,la)=>inPoly(lo,la,D.platform,D.ptype);
function utm17s(lon,lat){            // WGS84 -> UTM zona 17 Sur
  const a=6378137,e2=0.00669437999014,k0=0.9996,ep=e2/(1-e2),ph=lat*Math.PI/180,l=(lon+81)*Math.PI/180;
  const s=Math.sin(ph),c=Math.cos(ph),t=Math.tan(ph),N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep*c*c,A=c*l;
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*ph-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*ph)+(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*ph)-(35*e2**3/3072)*Math.sin(6*ph));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep)*A**5/120)+500000;
  const Nn=k0*(M+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep)*A**6/720))+10000000;
  return[E,Nn];
}
const utmTxt=(lo,la)=>{const u=utm17s(lo,la);return'E '+Math.round(u[0])+'  N '+Math.round(u[1])};

const barrios=D.barrios.map(b=>{
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  polys(b.g,b.t).forEach(p=>p[0].forEach(q=>{const a=P(q[0],q[1]);x0=Math.min(x0,a[0]);x1=Math.max(x1,a[0]);y0=Math.min(y0,a[1]);y1=Math.max(y1,a[1])}));
  return Object.assign(b,{bb:[x0,y0,x1,y1],llbb:[U(x0,y1),U(x1,y0)],d:pathD(b.g,b.t)});
});
const byId={},idByName={};barrios.forEach(b=>{byId[b.id]=b;idByName[b.nombre]=b.id});
function barrioAt(lo,la){
  for(const b of barrios){if(lo<b.llbb[0][0]||lo>b.llbb[1][0]||la<b.llbb[0][1]||la>b.llbb[1][1])continue;if(inPoly(lo,la,b.g,b.t))return b}
  return null;
}

const segs=D.streets.map(s=>{
  const pts=s.g.map(q=>P(q[0],q[1]));let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  const mid=s.g[Math.floor(s.g.length/2)];const b=s.m>0?barrioAt(mid[0],mid[1]):null;
  return{n:s.n,t:s.t,r:s.r,e:s.e,m:s.m,pts,len,b:b?b.id:null,d:'M'+pts.map(a=>f1(a[0])+' '+f1(a[1])).join('L')};
});
const streetNames=(()=>{const m={};segs.forEach(s=>{if(!s.n||!s.m)return;(m[s.n]=m[s.n]||{n:s.n,segs:[],len:0}).segs.push(s);m[s.n].len+=s.m});

const INC_T=(()=>{const c={};incid.forEach(x=>c[x.t]=(c[x.t]||0)+1);return Object.keys(c).sort((a,b)=>c[b]-c[a])})();
const equip=D.equip.map((q,i)=>({id:'e'+i,n:q.n,c:q.c,lon:q.lon,lat:q.lat,b:q.b}));
const EQ_C=(()=>{const c={};equip.forEach(x=>c[x.c]=(c[x.c]||0)+1);return Object.keys(c).sort((a,b)=>c[b]-c[a])})();
function nearestStreet(lo,la,maxM){
  const p=P(lo,la);let best=null,bd=1e9;
  for(const s of segs){const q=s.pts;for(let i=1;i<q.length;i++){
    const a=q[i-1],b=q[i],dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy||1e-9;
    let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l2;t=t<0?0:t>1?1:t;
    const d=Math.hypot(p[0]-(a[0]+t*dx),p[1]-(a[1]+t*dy));if(d<bd){bd=d;best=s}}}
  return bd<=(maxM||30)?best:null;
}

// El vecino no puede leer las tablas (privacidad), pero si el estado de lo que el mismo envio:
// el servidor responde solo id y estado de los identificadores que este navegador conoce.
async function syncMine(){
  const ok=m=>/^[0-9a-f-]{36}$/i.test(m.id),P=mineOf('puntos'),R=mineOf('reports');
  const ip=P.filter(ok).map(m=>m.id).slice(-80),ir=R.filter(ok).map(m=>m.id).slice(-80);
  if(!ip.length&&!ir.length)return;
  try{
    const r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/estado_mios`,{method:'POST',headers:sbH(),body:JSON.stringify({p_puntos:ip,p_reportes:ir})});
    if(!r.ok)return;
    const st={};(await r.json()).forEach(x=>{st[x.tabla+':'+x.id]=x.estado});
    const upd=(k,tab,list)=>lsSet('pg_mis_'+k,list
      .filter(m=>!ok(m)||st[tab+':'+m.id]!==undefined||Date.now()-(m.createdAt||0)<120000)   // borrado por el tecnico: se quita
      .map(m=>st[tab+':'+m.id]?Object.assign({},m,{estado:st[tab+':'+m.id]}):m));
    upd('puntos','puntos',P);upd('reports','reportes',R);
  }catch(e){}
}

      c.items=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));Store.synced=Date.now();changed();
    },()=>{}));
    return;
  }
  if(SUPABASE_URL&&SUPABASE_KEY){
    Store.mode='supabase';
    const t=ssGet('pg_tok'),e=+ssGet('pg_tok_exp')||0;
    if(t&&e>Date.now()){Store.token=t;Store.admin=true}

    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-Store.synced>20000)Store.fetchSb()});

  Object.values(COLS).forEach(c=>{c.items=lsGet('pg_'+c.key,[])});
};

const fmtV=v=>nf.format(Math.round(v*10)/10);
function hbars(list,o={}){
  const max=Math.max(1,...list.map(r=>r.v));
  return list.map(r=>{const tag=r.act?'button':'div';
    return`<${tag} ${r.act?`type="button" data-act="${esc(r.act)}"`:''} class="hb${r.off?' off':''}" data-tip="${esc(r.tip||`<b>${esc(r.label)}</b>: ${fmtV(r.v)}${o.unit||''}`)}">
      <span class="hl">${esc(r.label)}</span><span class="ht"><i style="width:${(r.v/max*100).toFixed(1)}%;background:${r.c||'var(--ink-2)'}"></i></span><span class="hv">${r.vt!=null?r.vt:fmtV(r.v)}</span></${tag}>`}).join('');
}
function columns(cols,series,o={}){
  const max=Math.max(1,...cols.map(c=>series.reduce((s,x)=>s+(c.v[x.k]||0),0)));
  return`<div class="cols" style="--n:${cols.length}">${cols.map((c,i)=>{
    const tot=series.reduce((s,x)=>s+(c.v[x.k]||0),0),tag=c.act?'button':'div';
    const showV=o.allValues||(tot>0&&(tot===max||i===cols.length-1));
    return`<${tag} ${c.act?`type="button" data-act="${esc(c.act)}" aria-pressed="${!!c.on}"`:''} class="col${c.on?' on':''}${c.dim?' dim':''}" data-tip="${esc(`<b>${esc(c.tip||c.label)}</b>`+series.map(x=>`<br>${esc(x.name)}: ${nf.format(c.v[x.k]||0)}`).join(''))}">
      <span class="cv">${showV?nf.format(tot):''}</span><span class="stk">${series.map(x=>c.v[x.k]?`<i style="height:${(c.v[x.k]/max*100).toFixed(1)}%;background:${x.c}"></i>`:'').join('')}</span><span class="cl">${esc(c.label)}</span></${tag}>`}).join('')}</div>`
    +(series.length>1?`<div class="legend mt">${series.map(x=>`<span><b style="background:${x.c}"></b>${esc(x.name)}</span>`).join('')}</div>`:'');
}
function stackbar(parts,o={}){
  const tot=parts.reduce((s,p)=>s+p.v,0);
  if(!tot)return`<p class="empty">${o.empty||'Sin datos.'}</p>`;
  return`<div class="stack">${parts.filter(p=>p.v>0).map(p=>`<i style="flex:${p.v} 0 0;background:${p.c}" data-tip="${esc(`<b>${esc(p.label)}</b>: ${fmtV(p.v)}${o.unit||''} (${Math.round(p.v/tot*100)} %)`)}"></i>`).join('')}</div>
    <div class="legend">${parts.filter(p=>p.v>0||o.showZero).map(p=>`<span><b style="background:${p.c}"></b>${esc(p.label)} <span class="num">${p.vt!=null?p.vt:fmtV(p.v)}</span></span>`).join('')}</div>`;
}
const section=(title,body,aside)=>`<div class="sec"><div class="lab">${title}${aside?`<small>${aside}</small>`:''}</div>${body}</div>`;
function weekly(kinds){

  const cols=Array.from({length:12},(_,i)=>{const t=start-(11-i)*7*DAY,d=new Date(t);return{t,label:i%3===2||i===11?`${d.getDate()}/${d.getMonth()+1}`:'',tip:`Semana del ${d.getDate()}/${d.getMonth()+1}`,v:{}}});
  kinds.forEach(k=>rows(k,{noPeriod:true}).forEach(r=>{const t=tsOf(k,r);const i=Math.floor((t-cols[0].t)/(7*DAY));if(i>=0&&i<12)cols[i].v[k]=(cols[i].v[k]||0)+1}));
  return cols;
}

  <label class="chk" for="pOk"><input type="checkbox" id="pOk"><span>Autorizo que se registren mi nombre, la hora del reporte y mi dirección IP para verificar que el reporte es real. Solo los ve el equipo técnico.</span></label>

  <div class="hp" aria-hidden="true"><label>No llenar<input id="pWeb" tabindex="-1" autocomplete="off"></label></div>
  ${actsHtml('p','Enviar punto rojo','red')}</form>`);
  let fotoOk=null;const newId=uuid();

    e.preventDefault();const err=$('#pErr');err.textContent='';if($('#pWeb').value)return;
    const tipo=$('#pTipo').value,dias=$$('input[name=dia]:checked').map(x=>x.value),nom=$('#pNom').value.trim(),q=quota(),fIn=$('#pFoto'),fFile=fIn&&fIn.files[0];
    if(!tipo)return void(err.textContent='Elige el tipo de punto rojo.');
    if(!dias.length)return void(err.textContent='Marca al menos un día en que ocurre.');
    if(nom.length<3)return void(err.textContent='Escribe tu nombre.');
    if(!$('#pOk').checked)return void(err.textContent='Debes autorizar el registro de tus datos para enviar el reporte.');

    $('#pSend').disabled=true;

    if(fFile&&!foto){try{foto=fotoOk=await uploadFoto(fFile)}catch(fx){err.textContent=fx.message||'No se pudo subir la foto.';$('#pSend').disabled=false;return}}
    const o={id:newId,tipo,local:$('#pLocal').value.trim(),calle:$('#pCalle').value.trim(),barrio:pt.barrio.nombre,desc:$('#pDesc').value.trim(),dias,franja:$('#pFr').value,reportante:nom,lat:+pt.lat.toFixed(6),lon:+pt.lon.toFixed(6),foto,estado:'pendiente',createdAt:Date.now()};

    catch(x){err.textContent='No se pudo confirmar el envío. Pulsa de nuevo: si ya se había guardado, no se duplicará.';$('#pSend').disabled=false}
  });
}

/* =================== CSV =================== */
async function exportCsv(k){
  const q=v=>{let t=String(v==null?'':v);if(typeof v==='string'&&/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};  // evita formulas en Excel
  const list=rows(k).filter(r=>!r.ejemplo);
  const spec={
    reports:[['fecha_hora',r=>new Date(r.createdAt).toISOString()],['tipo',r=>r.tipo],['barrio',r=>nm(r.barrio)],['descripcion',r=>r.desc],['estado',r=>EST.reports[r.estado]||r.estado],['foto',r=>r.foto],['lat',r=>r.lat],['lon',r=>r.lon]],
    obras:[['titulo',r=>r.titulo],['barrio',r=>nm(r.barrio)],['estado',r=>EST.obras[r.estado]],['fecha',r=>r.fecha],['descripcion',r=>r.desc],['lat',r=>r.lat],['lon',r=>r.lon]],
    puntos:[['fecha_hora',r=>new Date(r.createdAt).toISOString()],['tipo',r=>r.tipo],['establecimiento',r=>r.local],['calle',r=>r.calle],['barrio',r=>nm(r.barrio)],['dias',r=>(r.dias||[]).join(' ')],['horario',r=>r.franja],['detalles',r=>r.desc],['reportante',r=>r.reportante],['ip',r=>r.ip],['foto',r=>r.foto],['estado',r=>EST.puntos[r.estado]||r.estado],['lat',r=>r.lat],['lon',r=>r.lon],['utm_e',r=>Math.round(utm17s(r.lon,r.lat)[0])],['utm_n',r=>Math.round(utm17s(r.lon,r.lat)[1])]]
  }[k];
  if(!list.length)return toast('No hay registros reales para descargar con estos filtros.');
  const text=[spec.map(s=>s[0]).join(',')].concat(list.map(r=>spec.map(s=>q(s[1](r))).join(','))).join('\n');
  const name=`plataforma-g-${k==='puntos'?'puntos-rojos':k}-${new Date().toISOString().slice(0,10)}.csv`;
  if(window.claude&&window.claude.use){
    try{const d=await window.claude.use('downloads');if(d){await d.save({filename:name,data:'﻿'+text});return}}catch(e){if(e&&e.code==='declined')return}
    return toast('La descarga no está disponible en esta vista.');
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}

/* =================== Busqueda =================== */
let qIdx=[],qSel=-1;
function buildIndex(){
  qIdx=[].concat(
    barrios.map(b=>({k:'Barrio',t:nm(b.nombre),go:()=>setBarrio(b.id)})),
    streetNames.map(s=>({k:'Calle',t:s.n,go:()=>showStreet(s)})),
    equip.map(q=>({k:'Equipam.',t:q.n||q.c,go:()=>focusFeature('equip',q.id)})),
    all('obras').map(o=>({k:'Obra',t:o.titulo,go:()=>{S.on.obras=true;focusFeature('obras',o.id)}})),
    canSeeAlcohol()?all('puntos').filter(p=>p.local).map(p=>({k:'Punto rojo',t:p.local+(p.calle?' · '+p.calle:''),go:()=>{S.on.puntos=true;focusFeature('puntos',p.id)}})):[]
  ).map(x=>Object.assign(x,{n:norm(x.t)}));
}
function runSearch(){
  const v=norm($('#q').value.trim()),ul=$('#qres');
  if(!v){ul.hidden=true;$('#q').setAttribute('aria-expanded','false');return}
  buildIndex();
  const words=v.split(/\s+/);
  const res=qIdx.filter(x=>words.every(w=>x.n.includes(w))).sort((a,b)=>(b.n.startsWith(v)-a.n.startsWith(v))||a.t.length-b.t.length).slice(0,8);
  qSel=res.length?0:-1;ul._res=res;
  ul.innerHTML=res.length?res.map((x,i)=>`<li role="option" id="qo${i}" aria-selected="${i===qSel}" data-i="${i}"><span class="k">${x.k}</span><span>${esc(x.t)}</span></li>`).join(''):'<li class="empty">Sin resultados</li>';
  ul.hidden=false;$('#q').setAttribute('aria-expanded','true');
}
function pickSearch(i){const ul=$('#qres'),x=ul._res&&ul._res[i];if(!x)return;ul.hidden=true;$('#q').value=x.t;$('#q').blur();x.go()}
$('#q').addEventListener('input',runSearch);
$('#q').addEventListener('keydown',e=>{
  const ul=$('#qres'),n=(ul._res||[]).length;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!n)return;e.preventDefault();qSel=(qSel+(e.key==='ArrowDown'?1:-1)+n)%n;$$('#qres li').forEach((li,i)=>li.setAttribute('aria-selected',i===qSel));$('#q').setAttribute('aria-activedescendant','qo'+qSel)}
  else if(e.key==='Enter'){e.preventDefault();pickSearch(Math.max(0,qSel))}
  else if(e.key==='Escape'){ul.hidden=true;$('#q').value=''}
});
$('#qres').addEventListener('pointerdown',e=>{const li=e.target.closest('li[data-i]');if(li){e.preventDefault();pickSearch(+li.dataset.i)}});
$('#q').addEventListener('blur',()=>setTimeout(()=>{$('#qres').hidden=true},150));
let hiT=0;
function showStreet(s){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;s.segs.forEach(g=>g.pts.forEach(p=>{x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}));
  L.hi.innerHTML='';el('path',{'class':'sthi',d:s.segs.map(g=>g.d).join('')},L.hi);
  S.on.streets=true;S.on.snames=true;inval(F.BASE|F.TREE);
  const mn=Math.max(P1[0]-P0[0],P1[1]-P0[1])*.22,cx=(x0+x1)/2,cy=(y0+y1)/2;   // tramos cortos: deja ver la cuadra alrededor
  if(x1-x0<mn){x0=cx-mn/2;x1=cx+mn/2}if(y1-y0<mn){y0=cy-mn/2;y1=cy+mn/2}
  flyTo(fitBox([x0,y0,x1,y1],1.6));clearTimeout(hiT);hiT=setTimeout(()=>{L.hi.innerHTML=''},5000);
  toast(`${s.n}: ${nf.format(Math.round(s.len))} m dentro de la plataforma.`);
}

/* =================== Interaccion con el mapa =================== */
const tip=$('#tip');
function showTip(html,x,y){tip.innerHTML=html;tip.hidden=false;const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(innerWidth-w-8,x+14)+'px';tip.style.top=Math.max(8,y-h-12)+'px'}
const hideTip=()=>{tip.hidden=true};
document.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse')return;const t=e.target.closest&&e.target.closest('[data-tip]');if(t&&!svg.contains(t))showTip(t.dataset.tip,e.clientX,e.clientY)});
document.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||svg.contains(e.target))return;const t=e.target.closest&&e.target.closest('[data-tip]');t?showTip(t.dataset.tip,e.clientX,e.clientY):hideTip()});
document.addEventListener('pointerout',e=>{if(!e.relatedTarget||!(e.relatedTarget.closest&&e.relatedTarget.closest('[data-tip],#map')))hideTip()});

let hovM=null,hovRaf=0,lastMove=null;
function hoverMap(){
  hovRaf=0;const e=lastMove;if(!e)return;
  const m=toMap(e.clientX,e.clientY),ll=U(m[0],m[1]),b=barrioAt(ll[0],ll[1]),st=nearestStreet(ll[0],ll[1],14);
  $('#sCoord').textContent='UTM 17S  '+utmTxt(ll[0],ll[1]);
  $('#sWhere').textContent=[b?nm(b.nombre):(inPlat(ll[0],ll[1])?'Plataforma G':'Fuera de la plataforma'),st&&st.n?st.n+' ('+st.r.toLowerCase()+', '+st.t.toLowerCase()+')':''].filter(Boolean).join(' · ');
  if(dragging)return;
  const mkEl=e.target.closest&&e.target.closest('.mk[data-k]'),mz=e.target.getAttribute&&e.target.getAttribute('data-m');
  const nm2=mz!=null?manz[+mz]:null;
  if(hovM!==nm2){if(hovM)hovM.el.classList.remove('hov');hovM=nm2;if(nm2&&S.on.manz)nm2.el.classList.add('hov')}
  if(mkEl){const r=findRec(mkEl.dataset.k,mkEl.dataset.id);if(r)return showTip(`<b>${esc(titleOf(mkEl.dataset.k,r))}</b><br>${KIND[mkEl.dataset.k]}${EST[mkEl.dataset.k]?' · '+EST[mkEl.dataset.k][r.estado||'pendiente']:''}`,e.clientX,e.clientY)}
  if(nm2&&S.on.manz)return showTip(`<b>Manzana …${esc(nm2.m)}</b><br>${nf.format(nm2.p)} habitantes${b?' · '+esc(nm(b.nombre)):''}`,e.clientX,e.clientY);
  if(st&&st.n&&S.on.streets)return showTip(`<b>${esc(st.n)}</b><br>${esc(st.r)} · ${esc(st.t)}`,e.clientX,e.clientY);
  hideTip();
}
let pts={},moved=false,start=null,pinch=null,lpT=0,lpFired=false,dragging=false;
const dist=()=>{const k=Object.keys(pts);if(k.length<2)return 0;const a=pts[k[0]],b=pts[k[1]];return Math.hypot(a.x-b.x,a.y-b.y)};
svg.addEventListener('pointerdown',e=>{
  if(e.button===2)return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  const n=Object.keys(pts).length;
  if(n===1){moved=false;lpFired=false;start={x:e.clientX,y:e.clientY};
    if(e.pointerType!=='mouse'){clearTimeout(lpT);lpT=setTimeout(()=>{if(!moved&&Object.keys(pts).length===1){lpFired=true;openCtx(start.x,start.y)}},550)}}
  if(n===2){pinch=dist();moved=true;clearTimeout(lpT)}
});
window.addEventListener('pointermove',e=>{
  if(svg.contains(e.target)&&e.pointerType==='mouse'){lastMove=e;if(!hovRaf)hovRaf=requestAnimationFrame(hoverMap)}
  const p=pts[e.pointerId];if(!p)return;
  const n=Object.keys(pts).length,d=dims(),k=view.w/d.W;
  if(n===1){
    if(!moved&&Math.hypot(e.clientX-start.x,e.clientY-start.y)<6)return;
    if(!moved){moved=true;dragging=true;svg.classList.add('drag');hideTip();clearTimeout(lpT);closeCtx()}
    cancelAnimationFrame(raf);view.cx-=(e.clientX-p.x)*k;view.cy-=(e.clientY-p.y)*k;p.x=e.clientX;p.y=e.clientY;applyView();
  }else if(n===2){
    p.x=e.clientX;p.y=e.clientY;const nd=dist();
    if(pinch&&nd){const ks=Object.keys(pts);zoomAt(pinch/nd,(pts[ks[0]].x+pts[ks[1]].x)/2,(pts[ks[0]].y+pts[ks[1]].y)/2);pinch=nd}
  }
});
const up=e=>{delete pts[e.pointerId];clearTimeout(lpT);if(Object.keys(pts).length<2)pinch=null;if(!Object.keys(pts).length){dragging=false;svg.classList.remove('drag')}};
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
svg.addEventListener('pointerleave',()=>{hideTip();if(hovM){hovM.el.classList.remove('hov');hovM=null}});
svg.addEventListener('wheel',e=>{e.preventDefault();closeCtx();zoomAt(Math.exp(e.deltaY*(e.ctrlKey?0.01:0.0016)),e.clientX,e.clientY)},{passive:false});
svg.addEventListener('contextmenu',e=>{e.preventDefault();if(lpFired){lpFired=false;return}hideTip();openCtx(e.clientX,e.clientY)});
svg.addEventListener('click',e=>{
  if(lpFired){lpFired=false;return}

svg.addEventListener('keydown',e=>{
  const c=center(),d=dims(),k=view.w/d.W,step=80*k;

  const map={'+':()=>zoomAt(0.7,...c),'=':()=>zoomAt(0.7,...c),'-':()=>zoomAt(1.4,...c),'0':()=>flyTo(home()),ArrowLeft:()=>{view.cx-=step;applyView()},ArrowRight:()=>{view.cx+=step;applyView()},ArrowUp:()=>{view.cy-=step;applyView()},ArrowDown:()=>{view.cy+=step;applyView()}};
  if(map[e.key]){e.preventDefault();map[e.key]()}

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},4200)}

/* =================== Arranque =================== */
if(matchMedia('(pointer:coarse)').matches)$('#hint').textContent='Mantén presionado el mapa para reportar';

})();
